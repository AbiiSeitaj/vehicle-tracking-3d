input:
  video_path: data/input.mp4
  output_path: outputs/output_3d_boxes.mp4
  output_width: 1280
  max_frames: null

runtime:
  opencv_threads: 2

detector:
  # No silent fallback: motion is an explicit diagnostic baseline only.
  backend: yolo
  yolo_model: models/yolov8n.pt
  confidence: 0.10
  image_size: 640
  device: cpu
  cpu_threads: 4
  min_height_px: 35
  detect_every_n: 1

  # Fractions of image width/height defining the drivable area used by the
  # OpenCV detector. The default is tuned for the supplied fixed camera.
  road_roi:
    - [0.00, 0.34]
    - [1.00, 0.34]
    - [1.00, 0.98]
    - [0.00, 0.98]

  min_area_ratio: 0.00045
  max_area_ratio: 0.18
  min_aspect_ratio: 0.45
  max_aspect_ratio: 4.50
  bbox_expand: 0.08
  background_learning_rate: 0.002

tracker:
  track_high_thresh: 0.25
  track_low_thresh: 0.10
  new_track_thresh: 0.30
  track_buffer: 30
  match_thresh: 0.8
  smoothing: 0.20

geometry:
  # These are priors, not externally supplied calibration measurements.
  camera_height_m: 2.5
  horizontal_fov_deg: 60.0
  fallback_vanishing_point: [0.50, 0.36]
  fallback_horizon_y: 0.25
  line_roi_y: [0.40, 0.95]
  line_sample_frames: 45
  estimate_orthogonal_vp: true
  min_secondary_vp_support: 0.15
  max_horizon_roll_deg: 15.0
  yaw_limit_deg: 85
  truck_yaw_limit_deg: 85
  fit_solver: scipy
  fit_max_nfev: 25
  track_smoothing: 0.65
  max_fit_error_ratio: 0.25
  dimension_priors:
    car: [4.5, 1.8, 1.5]
    truck: [12.0, 2.5, 3.8]
    bus: [12.0, 2.5, 3.2]
    motorcycle: [2.2, 0.8, 1.4]

render:
  box_color: [0, 255, 255]
  rear_color: [0, 170, 255]
  text_color: [255, 255, 255]
  thickness: 3
  draw_2d_box: false
  draw_labels: true
  draw_vanishing_point: true
